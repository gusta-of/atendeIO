<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>atendeIO · Entrar</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
  <main class="auth-card panel">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3.5" fill="currentColor"/>
        </svg>
      </span>
      <div><h1>atendeIO</h1><p id="auth-sub">Entre para ver suas câmeras</p></div>
    </div>
    <form id="auth-form" class="form" autocomplete="on">
      <label>Usuário
        <input id="f-user" name="username" type="text" autocomplete="username" required minlength="3" maxlength="32" autofocus>
      </label>
      <label>Senha
        <input id="f-pass" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
      </label>
      <p id="auth-err" class="form-err" role="alert" hidden></p>
      <button id="auth-submit" class="btn primary" type="submit">Entrar</button>
      <button id="auth-toggle" class="btn ghost" type="button" hidden>Criar conta</button>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
