<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>atendeIO · Análise de fluxo</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/analytics.css">
</head>
<body class="an-body">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3.5" fill="currentColor"/>
        </svg>
      </span>
      <div><h1>atendeIO</h1><p>Análise de fluxo</p></div>
    </div>
    <div class="top-right">
      <a class="btn ghost" href="/">Painel de câmeras</a>
      <span id="user-name" class="muted"></span>
      <button id="btn-logout" class="btn ghost" type="button">Sair</button>
    </div>
  </header>

  <main class="an-main">
    <!-- Um filtro só, em uma linha, acima de tudo que ele afeta -->
    <section class="an-filters" aria-label="Filtros">
      <label>Câmera <select id="f-camera"></select></label>
      <div class="an-presets" role="group" aria-label="Período">
        <button type="button" class="chip-btn" data-days="0">Hoje</button>
        <button type="button" class="chip-btn" data-days="6">7 dias</button>
        <button type="button" class="chip-btn" data-days="29">30 dias</button>
        <button type="button" class="chip-btn" data-days="89">90 dias</button>
        <button type="button" class="chip-btn" data-days="custom">Personalizado</button>
      </div>
      <div id="f-custom" class="an-custom" hidden>
        <label>De <input id="f-from" type="date"></label>
        <label>Até <input id="f-to" type="date"></label>
      </div>
      <label>Funcionamento
        <span class="an-hours"><select id="f-hfrom" aria-label="Hora inicial"></select> às <select id="f-hto" aria-label="Hora final"></select></span>
      </label>
      <a id="btn-csv" class="btn ghost" href="#" download>Baixar CSV</a>
    </section>

    <section id="monitor-box" class="an-monitor" aria-label="Monitoramento"></section>

    <div id="an-content" class="an-content">
      <!-- preenchido por analytics.js -->
    </div>
  </main>

  <div id="an-tip" class="an-tip" role="status" hidden></div>
  <script src="/static/analytics.js"></script>
</body>
</html>
