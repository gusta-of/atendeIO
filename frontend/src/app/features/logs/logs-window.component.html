<section #root class="win" [class.min]="minimized()" [class.paused]="paused()" role="dialog" [attr.aria-label]="'Logs da câmera ' + camera().name"
  [style.left.px]="geom().x" [style.top.px]="geom().y" [style.width.px]="geom().w" [style.height.px]="geom().h" [style.z-index]="z()" (pointerdown)="raise()">
  <div class="head" (pointerdown)="startDrag($event)">
    <strong>Logs · {{ camera().name }}</strong>
    <span class="dot" [class]="'dot ' + status().kind"></span>
    <span class="status">{{ status().text }}</span>
    <span class="grow"></span>
    <button class="fw-btn" type="button" title="Recolher (desliga a conexão)" (click)="toggleMin()">–</button>
    <button class="fw-btn" type="button" title="Fechar" (click)="close()">×</button>
  </div>
  <div class="body">
    <div class="tools">
      <div class="r">
        <button class="btn mini" type="button" (click)="togglePause()">{{ paused() ? 'Retomar' : 'Pausar' }}</button>
        <button class="btn mini" type="button" (click)="clear()">Limpar</button>
        <button class="btn mini" type="button" (click)="copy()">{{ flash() || 'Copiar' }}</button>
        <button class="btn mini" type="button" title="Baixa tudo que foi capturado (NDJSON)" (click)="save()">Baixar .ndjson</button>
        <label class="chk"><input type="checkbox" [checked]="autoscroll()" (change)="setAuto($any($event.target).checked)"> Rolar</label>
      </div>
      <div class="r">
        @for (t of types; track t.id) {
          <label class="chk"><input type="checkbox" [checked]="typeOn().has(t.id)" (change)="setType(t.id, $any($event.target).checked)"> {{ t.label }}</label>
        }
      </div>
      <input type="search" class="search" placeholder="Filtrar (ex.: area.status, Mesa 1)" aria-label="Filtrar logs" (input)="setQuery($any($event.target).value)">
    </div>
    <div class="stats muted">{{ statsText() }}</div>
    <div #list class="list" role="log" aria-live="off" (scroll)="onScroll()">
      <div class="spacer" [style.height.px]="total() * rowH"></div>
      <div class="rows" [style.transform]="'translateY(' + offset() + 'px)'">
        @for (r of rows(); track r.i) {
          <div class="line" [class]="'line t-' + r.e.type" [class.sel]="r.e === selected()" (click)="pick(r.e)">
            <span class="time">{{ clock(r.e.ts) }}</span><span class="type">{{ r.e.type }}</span><span class="event">{{ r.e.event }}</span><span class="data">{{ r.e._s }}</span>
          </div>
        }
      </div>
    </div>
    @if (inspector()) { <pre class="inspector">{{ inspector() }}</pre> }
  </div>
</section>
